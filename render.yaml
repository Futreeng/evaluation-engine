services:
  - type: web
    name: convergence-api
    runtime: node
    plan: standard
    buildCommand: cd server && npm ci --omit=dev
    startCommand: cd server && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3005
      - key: DATABASE_URL
        fromDatabase:
          name: convergence-postgres
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: ENCRYPTION_KEY
        sync: false
      - key: APIFY_TOKEN
        sync: false
      - key: INSTAGRAM_ACCESS_TOKEN
        sync: false
      - key: INSTAGRAM_BUSINESS_ACCOUNT_ID
        sync: false
      - key: CLAUDE_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: STRIPE_API_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      # Email (Resend). See docs/EMAIL_SETUP.md. Unset RESEND_API_KEY → every
      # send is logged, nothing goes out.
      - key: TIKTOK_CLIENT_KEY
        sync: false
      - key: TIKTOK_CLIENT_SECRET
        sync: false
      - key: IG_APP_ID
        value: '1036695342742623'
      - key: IG_APP_SECRET
        sync: false
      # Verifies Meta's deauthorize / data-deletion signed_request. A different
      # value from IG_APP_SECRET: app 1617940326404118 → Settings → Basic.
      - key: META_APP_SECRET
        sync: false
      # Per-platform off switches; unset means "on if credentials are set".
      - key: CONNECT_TIKTOK_ENABLED
        sync: false
      - key: CONNECT_INSTAGRAM_ENABLED
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: REPLY_TO
        value: hello@futreeng.com
      - key: EMAIL_POSTAL_ADDRESS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: APP_URL
        sync: false
      - key: FREE_SNAPSHOTS_PER_EMAIL
        value: '1'

databases:
  - name: convergence-postgres
    engine: postgres
    ipAllowList: [] # Only accessible to services in this project
