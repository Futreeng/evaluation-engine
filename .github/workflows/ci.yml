# Unit tests and syntax checks on every push; the end-to-end smoke against a running
# deploy on demand (needs SMOKE_BASE, and a server started with FREE_SNAPSHOTS_PER_EMAIL=unlimited).
name: ci
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      smoke_base:
        description: "Base URL of a running server to smoke (e.g. https://scalecraft.onrender.com)"
        required: false
jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci --ignore-scripts || npm install --ignore-scripts
      - run: cd server && (npm ci --ignore-scripts || npm install --ignore-scripts)
      - run: npm run check
      - run: npm test
  smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.smoke_base != ''
    runs-on: ubuntu-latest
    needs: unit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: SMOKE_BASE="${{ inputs.smoke_base }}" SMOKE_FREE_UNLIMITED=1 SMOKE_HANDLE="${{ secrets.SMOKE_HANDLE || 'talon__wilson' }}" node server/scripts/smoke.js
